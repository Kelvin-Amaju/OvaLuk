services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: appscope
      MYSQL_USER: appscope
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-password
    volumes:
      - appscope_mysql:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    ports:
      - "8080:80"
    env_file: ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  appscope_mysql:
